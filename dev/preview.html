<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio · Desktop y móvil</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #181818; color: #eee; font: 14px system-ui, sans-serif; }
    header { padding: 14px 20px; border-bottom: 1px solid #444; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 26%); gap: 20px; padding: 20px; height: calc(100dvh - 49px); }
    section { min-width: 0; display: flex; flex-direction: column; }
    h2 { margin: 0 0 12px; font-size: 14px; font-weight: 500; }
    .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; background: #000; }
  </style>
</head>
<body>
  <header>Previsualización en desarrollo · cambios en directo</header>
  <main>
    <section><h2>Desktop · 1920 × 1080</h2><div class="stage" data-width="1920" data-height="1080"><iframe src="/" title="Desktop 1920 por 1080" width="1920" height="1080"></iframe></div></section>
    <section><h2>iPhone Air · 420 × 912 CSS px</h2><div class="stage" data-width="420" data-height="912"><iframe src="/" title="iPhone Air 420 por 912" width="420" height="912"></iframe></div></section>
  </main>
  <script type="module">
    const observer = new ResizeObserver(entries => {
      for (const { target, contentRect } of entries) {
        const scale = Math.min(contentRect.width / Number(target.dataset.width), contentRect.height / Number(target.dataset.height));
        target.querySelector('iframe').style.transform = `scale(${scale})`;
      }
    });
    document.querySelectorAll('.stage').forEach(stage => observer.observe(stage));
  </script>
</body>
</html>
